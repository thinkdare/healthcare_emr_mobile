name: healthcare_emr_mobile
description: "Healthcare providers' Electronic Medical Record System - Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.0

  # HTTP Client
  dio: ^5.4.0

  # Secure Storage (auth tokens)
  flutter_secure_storage: ^9.0.0

  # JSON Serialization
  json_annotation: ^4.10.0

  # URL Launcher (Stripe checkout)
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2

  # ── Phase 2 additions ─────────────────────────────────────────────────────
  
  # Local SQLite database for offline caching
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.4+4

  # Path helper (required by sqflite to locate the DB file)
  path: ^1.9.0

  # Network connectivity detection (online/offline indicator)
  connectivity_plus: ^6.1.1

  # UUID generation for sync client ID
  uuid: ^4.5.1

  # Shared preferences for lightweight key-value storage (cache metadata)
  shared_preferences: ^2.3.3

  # File picker (document upload)
  file_picker: ^8.1.6

  # Date/time formatting
  intl: ^0.20.0

  # PDF invoice download (path_provider for the save location, open_file to view it)
  path_provider: ^2.1.6
  open_file: ^4.0.0

  # Encrypted local cache (iOS/Android only — see LocalDatabase's class doc
  # for why desktop stays on plaintext sqflite_common_ffi). No
  # dependency_overrides needed for the sqflite/sqflite_sqlcipher iOS pod
  # conflict some versions require — that's only for sqflite < 2.3.2, and
  # this project is already on 2.4.x.
  sqflite_sqlcipher: ^3.4.1

  # Biometric app-lock gating (Face ID/fingerprint, falls back to device
  # passcode) — gates resume-from-background and cold start when a session
  # already exists.
  local_auth: ^3.0.2
  safe_device: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.0
  json_serializable: ^6.12.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
          weight: 800